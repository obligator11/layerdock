<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>LayerDock</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="bg-glow"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="assets/logo.png" alt="" onerror="this.style.display='none'" />
        <span class="brand-name">LayerDock</span>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="convert">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
            <path d="M12 16V4M12 4l-5 5M12 4l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Convert
        </button>
        <button class="nav-item" data-view="history">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
            <path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" />
            <path d="M3 3v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
          History
        </button>
        <button class="nav-item" data-view="settings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
            <path
              d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Settings
        </button>
      </nav>
      <div class="sidebar-footer">
        <span class="status-dot" id="backendStatus"></span>
        <span id="backendStatusText">Checking backend…</span>
      </div>
    </aside>

    <main class="main">
      <section class="view" id="convertView">
        <section class="dropzone" id="dropzone">
          <div class="dropzone-inner">
            <div class="dropzone-icon">
              <svg viewBox="0 0 24 24" fill="none" width="26" height="26">
                <path d="M12 16V4M12 4l-5 5M12 4l5 5" stroke="white" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
                <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="white" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </div>
            <h1>Drop PDFs to convert</h1>
            <p>Pixel-perfect PDF → editable DOCX, fully offline.</p>
            <button class="btn-primary" id="selectFilesBtn">Select PDF files</button>
          </div>
        </section>

        <section class="queue hidden" id="queueView">
          <div class="batch-summary hidden" id="batchSummary"></div>
          <header class="queue-header">
            <h2>Conversion Queue</h2>
            <div class="queue-actions">
              <button class="btn-ghost" id="addMoreBtn">+ Add files</button>
              <button class="btn-ghost" id="clearQueueBtn">Clear all</button>
              <button class="btn-secondary" id="convertAllBtn">Convert All</button>
              <button class="btn-primary" id="downloadAllBtn" disabled>Download All</button>
            </div>
          </header>
          <div class="queue-list" id="queueList"></div>
        </section>
      </section>

      <section class="view hidden" id="historyView">
        <header class="queue-header">
          <h2>Conversion History</h2>
          <button class="btn-ghost" id="clearHistoryBtn">Clear history</button>
        </header>
        <div class="history-list" id="historyList"></div>
      </section>

      <section class="view hidden" id="settingsView">
        <header class="queue-header">
          <h2>Settings</h2>
        </header>

        <div class="settings-card">
          <div class="settings-row">
            <div>
              <div class="settings-label">Default output folder</div>
              <div class="settings-value" id="outputFolderValue">Automatic — a "LayerDock Output" folder next to each
                source PDF</div>
            </div>
            <div class="settings-row-actions">
              <button class="btn-secondary btn-small" id="changeOutputFolderBtn">Change</button>
              <button class="btn-ghost btn-small" id="resetOutputFolderBtn">Reset</button>
            </div>
          </div>

          <div class="settings-row">
            <div>
              <div class="settings-label">App data &amp; history database</div>
              <div class="settings-value" id="dataDirValue">—</div>
            </div>
            <div class="settings-row-actions">
              <button class="btn-secondary btn-small" id="openDataFolderBtn">Open folder</button>
            </div>
          </div>

          <div class="settings-row">
            <div>
              <div class="settings-label">OCR engine (Tesseract)</div>
              <div class="settings-value" id="ocrStatusValue">Checking…</div>
            </div>
            <div class="settings-row-actions">
              <button class="btn-secondary btn-small" id="recheckOcrBtn">Re-check</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="app.js"></script>
</body>

</html>
